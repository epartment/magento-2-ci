name: Gitlab CI Bundling
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # 03 AM on first day of the month
  pull_request:
  push:
    paths:
      - .trigger
      - bundling/Dockerfile
      - .github/workflows/imageci-bundling.yml
      - .github/workflows/php-matrix/bundling-generator.php
      - .github/workflows/php-matrix/constants.php
jobs:
  bundling-matrix:
    name: Generate Bundling-Node Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
      - id: matrix
        run: |
          php .github/workflows/php-matrix/bundling-generator.php >> $GITHUB_OUTPUT
      - run: echo "Matrix:\n";echo '${{ steps.matrix.outputs.matrix }}'

  ci-bundling:
    name: Gitlab CI Bundling + Node ${{ matrix.node_version }}
    runs-on: ubuntu-latest
    needs: bundling-matrix
    strategy:
      fail-fast: false
      max-parallel: ${{ github.ref == 'refs/heads/master' && 6 || 0 }}
      matrix: ${{fromJson(needs.bundling-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: ${{ !env.ACT }}

      - uses: docker/build-push-action@v5
        with:
          context: bundling
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_VERSION=${{ matrix.node_version }}
            OS_RELEASE=${{ matrix.node_os_release }}

          push: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
          tags: docker.io/${{ github.repository_owner }}/gitlab-ci:bundling-node${{ matrix.node_version }}
          cache-from: type=registry,ref=docker.io/epartment/gitlab-ci:bundling-node${{ matrix.node_version }}-buildcache
          cache-to: type=registry,ref=docker.io/epartment/gitlab-ci:bundling-node${{ matrix.node_version }}-buildcache,mode=max

      - uses: docker/build-push-action@v5
        if: ${{ matrix.latest }}
        with:
          context: bundling
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_VERSION=${{ matrix.node_version }}
            OS_RELEASE=${{ matrix.node_os_release }}

          push: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
          tags: docker.io/${{ github.repository_owner }}/gitlab-ci:bundling-nodelatest
          cache-from: type=registry,ref=docker.io/epartment/gitlab-ci:bundling-nodelatest-buildcache
          cache-to: type=registry,ref=docker.io/epartment/gitlab-ci:bundling-nodelatest-buildcache,mode=max
